# One app's Release, built once for every Environment it deploys to (ADR-0119,
# ADR-0125): called by the Deploy workflow (deploy.yml) once per app, before
# any Installation deploys. It runs `@keepr/tooling`'s
# `packages/tooling/scripts/deploy/cli.mjs build` from the calling run's own
# commit (main) against the Release's checkout: the deploy descriptor's build
# scripts (for Stream Keepr the build, the Wasm dry run and the Worker smoke),
# and uploads what they built as the run's artifact `build-<app>`. Every
# Installation the run deploys, staging's and production's, downloads that
# artifact (deploy-installation.yml), so production deploys the bytes staging
# ran, and `/api/release` names the Release they were built from.
#
# It holds no secret and changes nothing remote: no GitHub environment.

name: Build a Release

on:
  workflow_call:
    inputs:
      app:
        description: The app, as its deploy descriptor names it (stream).
        required: true
        type: string
      release:
        description: Its Release's tag, resolved by the plan (@keepr/stream@1.8.0).
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # nuxt build OOMs Node's default ~2GB heap on hosted runners.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release }}
          persist-credentials: false
      - name: Check out the deploy tooling from the calling run's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .deploy-tooling
          # The deploy CLI and every module it imports.
          sparse-checkout: |
            packages/tooling/scripts/deploy/
            packages/tooling/scripts/deploy-guard.mjs
            packages/tooling/scripts/jsonc.mjs
            packages/tooling/scripts/shipped-code.mjs
            packages/tooling/scripts/versioned-apps.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build, dry-run and smoke the Release, and set its output aside
        env:
          # Inputs cross into the shell via env, never by expression
          # interpolation inside `run:`.
          INPUT_APP: ${{ inputs.app }}
        run: node .deploy-tooling/packages/tooling/scripts/deploy/cli.mjs build --app "$INPUT_APP" --artifact "$RUNNER_TEMP/build"
      - name: Upload the build every Environment deploys
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ inputs.app }}
          path: ${{ runner.temp }}/build
          if-no-files-found: error
