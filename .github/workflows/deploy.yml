# Manually triggered deploy of one or more apps' Releases to an Environment —
# the Actions counterpart of `pnpm run deploy --app <app> --env <env>`, once
# per app. It exists as an *option*, not a replacement: deploys are never
# merge- or release-triggered, because deploy day is a human procedure
# (apps/stream/README.md § Deploy day). This workflow covers only what that
# covers — per app: build, the descriptor's checks (for Stream Keepr the Wasm
# dry run and the Worker smoke), parts by fingerprint, deploy order, D1
# migration, Worker promotion, release-identity verify. Everything after
# promotion stays with the operator:
#
#   - Each app's deployed acceptance gates run locally (Stream Keepr's six:
#     `pnpm accept deployed`), in order, stopping at the first failure. The
#     validator pre-flight needs your Docker, so they cannot run on a hosted
#     runner.
#   - "Nothing on air" is a condition only a person can verify before
#     triggering this.
#
# Actions deploys ship released tags, never main's HEAD: each app's Release
# resolves through its GitHub Releases, `@keepr/<app>@<version>` (cut by
# merging the Version PR, ADR-0118), so what promotes is always a formally
# released snapshot — since ADR-0036, a commit that passed CI in the merge
# queue — and rollback is dispatching this workflow with the previous tag.
# The `v*` tags release-please made are history and never deploy. Local
# `pnpm run deploy` stays free-form for emergencies.
#
# The `plan` job resolves the Releases (packages/tooling/scripts/deploy/plan.mjs)
# and deploys nothing. Each app then deploys as its own job, through
# deploy-installation.yml, in the Environment's GitHub environment (ADR-0122)
# with a concurrency group of its own (that file says what each holds).
# Keepr Accounts' job runs first, and every App's job waits for it to
# succeed, because deploy order refuses an App that Keepr Accounts'
# Installation does not allow (ADR-0120); the Apps deploy side by side. An app
# joins with its deploy descriptor: nothing here names it.
#
# The app and each of its parts have their own promotion marker, an annotated
# git tag (ADR-0035, ADR-0119): `stream/production` for Stream Keepr's app and
# `stream/production-validator` for its validator, each `pending` while its
# deploy runs and `deployed` once it is confirmed, so a run that fails between
# the two records exactly that. The markers are pushed with the release GitHub
# App's token, not GITHUB_TOKEN, which can never hold `workflows` and so cannot
# put a marker on a Release whose workflows differ from main's (ADR-0124). No
# GITHUB_TOKEN in this run can write.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      releases:
        description: >-
          Apps and Releases to deploy, separated by spaces: an app for its most
          recent GitHub Release (stream), or a tag (@keepr/stream@1.7.0).
          Keepr Accounts deploys first, whatever the order.
        required: true
        type: string
        default: stream
      environment:
        description: The Environment every app here deploys to.
        required: true
        type: choice
        default: production
        options:
          - production
          - staging
      d1_recovery_point:
        description: >-
          Type "confirmed" once a recent D1 Time Travel recovery point or
          export exists for every app deployed (README § Deploy day). D1
          migration and Worker promotion are not one atomic transaction; this
          is the rollback anchor.
        required: true
        type: string
      validator:
        description: >-
          Parts (Stream Keepr's silent-video validator). auto: deploy each first
          unless its marker records a confirmed deploy with the target
          Release's fingerprint (its bundle, Container context and
          configuration). always/never override the detection.
        required: false
        type: choice
        default: auto
        options:
          - auto
          - always
          - never
      override:
        description: >-
          Deploy out of order: one line saying why (README § Deploy order).
          Recorded in the app's marker. Only for a run of one app; leave
          empty otherwise.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  plan:
    name: Plan the deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      accounts: ${{ steps.plan.outputs.accounts }}
      apps: ${{ steps.plan.outputs.apps }}
    steps:
      - name: Require the D1 recovery-point confirmation
        if: inputs.d1_recovery_point != 'confirmed'
        run: |
          echo '::error::Refusing to deploy: the d1_recovery_point input must be the word "confirmed".'
          exit 1
      - name: Check out the deploy tooling from this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .deploy-tooling
          # The plan and every module it imports.
          sparse-checkout: |
            packages/tooling/scripts/deploy/
            packages/tooling/scripts/jsonc.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # Only published GitHub Releases resolve; a v* tag, a draft or an
      # unknown app refuses the whole run before any job deploys.
      - name: Resolve each app's Release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          # Dispatch inputs cross into the shell via env, never by expression
          # interpolation inside `run:`.
          INPUT_RELEASES: ${{ inputs.releases }}
          INPUT_OVERRIDE: ${{ inputs.override }}
        run: node .deploy-tooling/packages/tooling/scripts/deploy/plan.mjs

  accounts:
    name: Keepr Accounts
    needs: plan
    if: needs.plan.outputs.accounts != ''
    uses: ./.github/workflows/deploy-installation.yml
    with:
      app: accounts
      release: ${{ needs.plan.outputs.accounts }}
      environment: ${{ inputs.environment }}
      parts: ${{ inputs.validator }}
      override: ${{ inputs.override }}
    # By name, never `inherit`: the job reads them from its GitHub
    # environment, which a called workflow can only when they are passed.
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      KEEPR_RELEASE_APP_ID: ${{ secrets.KEEPR_RELEASE_APP_ID }}
      KEEPR_RELEASE_APP_PRIVATE_KEY: ${{ secrets.KEEPR_RELEASE_APP_PRIVATE_KEY }}

  apps:
    name: ${{ matrix.app }}
    needs: [plan, accounts]
    # After Keepr Accounts deployed, or when this run does not deploy it;
    # never after it failed or the run was cancelled.
    if: >-
      !cancelled()
      && needs.plan.result == 'success'
      && needs.plan.outputs.apps != '[]'
      && (needs.accounts.result == 'success' || needs.accounts.result == 'skipped')
    strategy:
      # One App's failure does not cancel another's deploy part-way.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.apps) }}
    uses: ./.github/workflows/deploy-installation.yml
    with:
      app: ${{ matrix.app }}
      release: ${{ matrix.release }}
      environment: ${{ inputs.environment }}
      parts: ${{ inputs.validator }}
      override: ${{ inputs.override }}
    # By name, never `inherit`: the job reads them from its GitHub
    # environment, which a called workflow can only when they are passed.
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      KEEPR_RELEASE_APP_ID: ${{ secrets.KEEPR_RELEASE_APP_ID }}
      KEEPR_RELEASE_APP_PRIVATE_KEY: ${{ secrets.KEEPR_RELEASE_APP_PRIVATE_KEY }}
