# Deploys one or more apps' Releases: each Release to staging and then, once a
# person approves, to production; or, dispatched by hand, to one Environment.
# The Actions counterpart of `pnpm run deploy --app <app> --env <env>`, once
# per app and Environment.
#
# When it runs (ADR-0125, amending the policy this header stated before):
#
#   - **A Release dispatches it.** Once the release workflow (release.yml) has
#     passed the release gate (ADR-0036), tagged and published the GitHub
#     Releases, it dispatches one run with every app it released, to staging
#     then production. Deploys are never merge-triggered: a merge to main
#     that releases nothing deploys nothing, and what deploys is always a
#     released tag, never main's HEAD.
#   - **By hand**, for a rollback or a redeploy: one Environment, or staging
#     then production, any published Release. Production stays behind its
#     approval either way. Local `pnpm run deploy` stays for emergencies.
#
# What a run does, per app:
#
#   1. **Build once** (deploy-build.yml): the descriptor's build, dry run and
#      Worker smoke, uploaded as the artifact every Environment deploys, so
#      production runs the bytes staging ran.
#   2. **Staging** (GitHub environment `staging`, no approval): the
#      Installation's required Worker secrets, deploy order, the D1 recovery
#      point, parts by fingerprint, D1 migrations, the Worker, deploy:verify
#      with the Release's identity, each between its promotion markers; then
#      the app's acceptance gates, with no person present (Stream Keepr's:
#      every deployed gate, which signs in and writes). Production's approval
#      means they passed on this build (ADR-0129).
#   3. **Production** (GitHub environment `production`): waits for its
#      required reviewer, then the same steps on the same artifact, without the
#      gates, which never run against production unattended. One "Review deployments" approves every App's production job at
#      once; the plan's summary on the run's page lists what to confirm first,
#      "nothing on air" among it, since GitHub's review dialog shows no text of
#      ours.
#
# The approval replaces the word an operator typed: before its first remote
# change each deploy reads every D1 database's Time Travel bookmark, refuses
# without one, and records it in its summary and the app's marker
# (packages/tooling/scripts/deploy/recovery.mjs). Fault injection stays a
# person's, against staging (apps/stream/README.md § Deploy day).
#
# The `plan` job resolves the Releases and the Environments
# (packages/tooling/scripts/deploy/plan.mjs) and deploys nothing. Each app
# then builds, and deploys to each Environment as its own job, through
# deploy-installation.yml, in that Environment's GitHub environment (ADR-0122)
# with a concurrency group per Installation (that file says what each holds).
# Keepr Accounts deploys to an Environment before any App does, and every
# App's job there waits for it to succeed, because deploy order refuses an App
# that Keepr Accounts' Installation does not allow (ADR-0120); the Apps deploy
# side by side, and production, Keepr Accounts' included, waits for every
# App's staging (packages/tooling/test/deployWorkflow.test.ts plays the job
# graph out). An app joins
# with its deploy descriptor: nothing here names it.
#
# Each Installation's app and parts have their own promotion marker, a GitHub
# Deployments environment (ADR-0035, ADR-0119, ADR-0133): `stream/staging`,
# `stream/production` and `stream/production-validator`, among others, each
# `pending` while its deploy runs and `deployed` once it is confirmed, so a run
# that fails between the two records exactly that, and redeploying the whole
# Release repairs either Environment. GITHUB_TOKEN writes them: the deploying
# jobs grant it `deployments: write`, and nothing in this run can write
# anything else. The release GitHub App is the release workflow's alone.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      releases:
        description: >-
          Apps and Releases to deploy, separated by spaces: an app for its most
          recent GitHub Release (stream), or a tag (@keepr/stream@1.7.0).
          Keepr Accounts deploys first, whatever the order.
        required: true
        type: string
        default: stream
      environment:
        description: >-
          Where every app here deploys: one Environment (a rollback goes to
          production alone), or staging then production, as a Release does.
          Production waits for its approval.
        required: true
        type: choice
        default: production
        options:
          - production
          - staging
          - staging then production
      validator:
        description: >-
          Parts (Stream Keepr's silent-video validator). auto: deploy each first
          unless its marker records a confirmed deploy with the target
          Release's fingerprint (its bundle, Container context and
          configuration). always/never override the detection.
        required: false
        type: choice
        default: auto
        options:
          - auto
          - always
          - never
      override:
        description: >-
          Deploy out of order: one line saying why (README § Deploy order).
          Recorded in the app's marker. Only for a run of one app; leave
          empty otherwise.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  plan:
    name: Plan the deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      accounts: ${{ steps.plan.outputs.accounts }}
      apps: ${{ steps.plan.outputs.apps }}
      builds: ${{ steps.plan.outputs.builds }}
      environments: ${{ steps.plan.outputs.environments }}
    steps:
      - name: Check out the deploy tooling from this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .deploy-tooling
          # The plan and every module it imports.
          sparse-checkout: |
            packages/tooling/scripts/deploy/
            packages/tooling/scripts/jsonc.mjs
            packages/tooling/scripts/shipped-code.mjs
            packages/tooling/scripts/versioned-apps.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # Only published GitHub Releases resolve; a v* tag, a draft or an
      # unknown app refuses the whole run before any job builds. Its summary
      # holds the checklist to confirm before approving production.
      - name: Resolve each app's Release and the Environments
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          # Dispatch inputs cross into the shell via env, never by expression
          # interpolation inside `run:`.
          INPUT_RELEASES: ${{ inputs.releases }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_OVERRIDE: ${{ inputs.override }}
        run: node .deploy-tooling/packages/tooling/scripts/deploy/plan.mjs

  build:
    name: Build ${{ matrix.release }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    uses: ./.github/workflows/deploy-build.yml
    with:
      app: ${{ matrix.app }}
      release: ${{ matrix.release }}

  accounts-staging:
    name: Keepr Accounts to staging
    needs: [plan, build]
    if: >-
      needs.plan.outputs.accounts != ''
      && contains(fromJSON(needs.plan.outputs.environments), 'staging')
    # The Installation writes its markers, GitHub Deployments, with GITHUB_TOKEN
    # (ADR-0133): a called workflow holds no more than this job grants.
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-installation.yml
    with:
      app: accounts
      release: ${{ needs.plan.outputs.accounts }}
      environment: staging
      parts: ${{ inputs.validator }}
      override: ${{ inputs.override }}
    # By name, never `inherit`: the job reads them from its GitHub
    # environment, which a called workflow can only when they are passed.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  apps-staging:
    name: ${{ matrix.app }} to staging
    needs: [plan, build, accounts-staging]
    # Every build succeeded, and Keepr Accounts reached staging first when the
    # run deploys it; never after a failure or a cancel.
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && needs.plan.outputs.apps != '[]'
      && contains(fromJSON(needs.plan.outputs.environments), 'staging')
      && (needs.plan.outputs.accounts == '' || needs.accounts-staging.result == 'success')
    strategy:
      # One App's failure does not cancel another's deploy part-way.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.apps) }}
    # The Installation writes its markers, GitHub Deployments, with GITHUB_TOKEN
    # (ADR-0133): a called workflow holds no more than this job grants.
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-installation.yml
    with:
      app: ${{ matrix.app }}
      release: ${{ matrix.release }}
      environment: staging
      parts: ${{ inputs.validator }}
      override: ${{ inputs.override }}
    # By name, never `inherit`: the job reads them from its GitHub
    # environment, which a called workflow can only when they are passed.
    # The operator is the one the Apps' acceptance gates sign in as, in
    # staging alone (ADR-0129).
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STREAM_KEEPR_ACCEPTANCE_OPERATOR_EMAIL: ${{ secrets.STREAM_KEEPR_ACCEPTANCE_OPERATOR_EMAIL }}
      STREAM_KEEPR_ACCEPTANCE_OPERATOR_PASSWORD: ${{ secrets.STREAM_KEEPR_ACCEPTANCE_OPERATOR_PASSWORD }}

  accounts-production:
    name: Keepr Accounts to production
    needs: [plan, build, accounts-staging, apps-staging]
    # After Keepr Accounts' staging and every App's passed, when the run
    # deploys to staging (ADR-0125): an App that failed staging stops the
    # whole run short of production, Keepr Accounts included.
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && needs.plan.outputs.accounts != ''
      && contains(fromJSON(needs.plan.outputs.environments), 'production')
      && (!contains(fromJSON(needs.plan.outputs.environments), 'staging') || needs.accounts-staging.result == 'success')
      && (!contains(fromJSON(needs.plan.outputs.environments), 'staging') || needs.plan.outputs.apps == '[]' || needs.apps-staging.result == 'success')
    # The Installation writes its markers, GitHub Deployments, with GITHUB_TOKEN
    # (ADR-0133): a called workflow holds no more than this job grants.
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-installation.yml
    with:
      app: accounts
      release: ${{ needs.plan.outputs.accounts }}
      environment: production
      parts: ${{ inputs.validator }}
      override: ${{ inputs.override }}
    # By name, never `inherit`: the job reads them from its GitHub
    # environment, which a called workflow can only when they are passed.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  apps-production:
    name: ${{ matrix.app }} to production
    needs: [plan, build, apps-staging, accounts-production]
    # After every App's staging passed, when the run deploys to staging, so
    # their production jobs wait for one approval together; and after Keepr
    # Accounts reached production, when the run deploys it.
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && needs.plan.outputs.apps != '[]'
      && contains(fromJSON(needs.plan.outputs.environments), 'production')
      && (!contains(fromJSON(needs.plan.outputs.environments), 'staging') || needs.apps-staging.result == 'success')
      && (needs.plan.outputs.accounts == '' || needs.accounts-production.result == 'success')
    strategy:
      # One App's failure does not cancel another's deploy part-way.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.apps) }}
    # The Installation writes its markers, GitHub Deployments, with GITHUB_TOKEN
    # (ADR-0133): a called workflow holds no more than this job grants.
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-installation.yml
    with:
      app: ${{ matrix.app }}
      release: ${{ matrix.release }}
      environment: production
      parts: ${{ inputs.validator }}
      override: ${{ inputs.override }}
    # By name, never `inherit`: the job reads them from its GitHub
    # environment, which a called workflow can only when they are passed.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
