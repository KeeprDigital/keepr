# One app's Release to one Environment: an Installation's deploy, called by
# the Deploy workflow (deploy.yml, which says why and when) once per app and
# Environment it deploys. It runs `@keepr/tooling`'s
# `packages/tooling/scripts/deploy/cli.mjs` from the calling run's own commit
# (main), not from the Release, and reads what to deploy from the Release's
# deploy descriptor, so rolling back to a Release older than the markers or the
# descriptor still deploys it the same way. It never runs a Release's own
# `pnpm run deploy`.
#
# It builds nothing: it deploys the run's artifact `build-<app>`, which
# deploy-build.yml built once for every Environment (ADR-0125). The Release
# checkout is still needed, for its D1 migrations, its parts and its Wrangler.
# Before its first remote change the deploy reads each D1 database's Time
# Travel bookmark and refuses without one, in every Environment
# (packages/tooling/scripts/deploy/recovery.mjs). In staging, the app's
# acceptance gates then run against the Installation, with no person present;
# in production, never (ADR-0129).
#
# Each Environment is one Cloudflare account and one GitHub environment of the
# same name (`production`, `staging`), shared by every app (ADR-0122). It deploys only
# from main, `production` behind a required reviewer, and holds a
# CLOUDFLARE_API_TOKEN that can deploy every app in that account (Workers Scripts:Edit,
# D1:Edit, Containers:Edit). The job reads it as the environment's own secret,
# which the caller passes by name. The account itself is no secret: each
# Environment's Wrangler configs name it (ADR-0130). One deploy of an
# Installation runs at a time.
#
# The promotion markers are GitHub Deployments (ADR-0133), which GITHUB_TOKEN
# writes with `deployments: write` at any commit, whatever its workflows: the
# job mints no App token, and its token writes nothing else.

name: Deploy an Installation

on:
  workflow_call:
    inputs:
      app:
        description: The app, as its deploy descriptor names it (stream).
        required: true
        type: string
      release:
        description: Its Release's tag, resolved by the plan (@keepr/stream@1.8.0).
        required: true
        type: string
      environment:
        description: The Environment its descriptor deploys to (staging, production).
        required: true
        type: string
      parts:
        description: auto, always or never (keepr-deploy deploy --parts).
        required: true
        type: string
      override:
        description: The deploy order override's reason, or empty.
        required: false
        type: string
        default: ''
    secrets:
      # The Environment's own, read from its GitHub environment: a called
      # workflow sees an environment secret only when the caller passes it by
      # name (deploy.yml does).
      CLOUDFLARE_API_TOKEN:
        required: true
      # The staging operator Stream Keepr's acceptance gates sign in as, from
      # the `staging` GitHub environment; only the Apps' staging call passes
      # them (ADR-0129).
      STREAM_KEEPR_ACCEPTANCE_OPERATOR_EMAIL:
        required: false
      STREAM_KEEPR_ACCEPTANCE_OPERATOR_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.release }} to ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
    # One run per Installation; another app's deploy is not held behind it.
    concurrency:
      group: deploy-${{ inputs.app }}-${{ inputs.environment }}
      cancel-in-progress: false
    # GITHUB_TOKEN writes the app's promotion markers, GitHub Deployments
    # (ADR-0133), and nothing else; the caller grants the same.
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release }}
          # Full history: deploy order reads what each commit contains
          # (ADR-0120); a shallow clone is refused.
          fetch-depth: 0
          # Nothing writes through this checkout: the markers are written
          # through GitHub's API, and the tags they replace are only read.
          persist-credentials: false
      - name: Check out the deploy tooling from the calling run's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .deploy-tooling
          # The deploy CLI and every module it imports.
          sparse-checkout: |
            packages/tooling/scripts/deploy/
            packages/tooling/scripts/deploy-guard.mjs
            packages/tooling/scripts/jsonc.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # Untracked files mark a checkout `dirty` in the markers; this one is
      # not part of the Release.
      - run: echo /.deploy-tooling/ >> .git/info/exclude
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the build every Environment deploys
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ inputs.app }}
          path: ${{ runner.temp }}/build
      # Places the downloaded build, refuses an Installation missing a required
      # Worker secret (ADR-0128), decides each part against its marker,
      # checks deploy order, reads each D1 database's Time Travel bookmark
      # (refusing without one), deploys each part the decision deploys, then
      # migrates D1, deploys the Worker and verifies its Release identity, each
      # between its markers. The step summary records the decisions and the
      # recovery points, and on failure what each marker now says
      # (apps/stream/README.md § Recovering from a partial promotion).
      - name: Deploy (the build, required secrets, parts when decided, deploy order, D1 recovery point, migrate D1, promote, verify)
        env:
          # On this step alone: job-level env would also reach the install's
          # build scripts and the setup actions, which deploy nothing.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The markers' GitHub Deployments, through `gh api`; on this step
          # alone, since the gates run the Release's own scripts.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Inputs cross into the shell via env, never by expression
          # interpolation inside `run:`: this step holds the Cloudflare token.
          INPUT_APP: ${{ inputs.app }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_PARTS: ${{ inputs.parts }}
          INPUT_OVERRIDE: ${{ inputs.override }}
        run: node .deploy-tooling/packages/tooling/scripts/deploy/cli.mjs deploy --app "$INPUT_APP" --env "$INPUT_ENVIRONMENT" --artifact "$RUNNER_TEMP/build" --parts "$INPUT_PARTS" ${INPUT_OVERRIDE:+--override "$INPUT_OVERRIDE"}
      # Staging only: the deploy descriptor's acceptance gates, with no person
      # present (Stream Keepr's: every deployed gate, which signs in and
      # writes). The harness itself refuses production when no person started
      # it (ADR-0129). A failure fails this job, and production does not deploy.
      # It runs the Release's own scripts, which need the Cloudflare
      # credentials: the validator gate writes to staging with Wrangler.
      - name: Run the acceptance gates against the Staging Installation
        if: inputs.environment == 'staging'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STREAM_KEEPR_ACCEPTANCE_OPERATOR_EMAIL: ${{ secrets.STREAM_KEEPR_ACCEPTANCE_OPERATOR_EMAIL }}
          STREAM_KEEPR_ACCEPTANCE_OPERATOR_PASSWORD: ${{ secrets.STREAM_KEEPR_ACCEPTANCE_OPERATOR_PASSWORD }}
          STREAM_KEEPR_ACCEPTANCE_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: node .deploy-tooling/packages/tooling/scripts/deploy/cli.mjs gates --app "$INPUT_APP" --env "$INPUT_ENVIRONMENT"
      - name: Remind the operator what is still owed
        env:
          RELEASE_TAG: ${{ inputs.release }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "Release $RELEASE_TAG deployed to $INPUT_ENVIRONMENT; its Installation answered deploy:verify (its release identity, or liveness only for a Release from before /api/release; not dependency health)." >> "$GITHUB_STEP_SUMMARY"
          if [ "$INPUT_ENVIRONMENT" = staging ]; then
            echo 'The acceptance gates above ran against this Installation. Fault injection stays manual, against staging (Stream Keepr: apps/stream/README.md § Fault injection).' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No acceptance gate runs here: they ran in staging, on this build, before the approval (ADR-0129).' >> "$GITHUB_STEP_SUMMARY"
          fi
