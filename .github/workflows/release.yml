# Releases with Changesets (ADR-0118). Each versioned app has its own
# Releases: its own version, CHANGELOG.md, `<app>@<version>` tag and GitHub
# Release. A change names the apps it ships in, in a changeset, and CI's
# changeset check holds that (packages/tooling/scripts/changeset-check.mjs).
# `.changeset/config.json` ignores an app with no deploy descriptor.
#
# On every push to main, `changesets/action`:
#
#   - while a changeset naming an app waits in `.changeset/`, opens or
#     refreshes the one Version PR for every app (`changeset version`: each
#     app's new version and CHANGELOG.md, the changesets consumed). Empty
#     changesets alone open none.
#   - once none waits, as when the Version PR has merged, runs the publish
#     script (`pnpm release:publish`): the release gate, then
#     `changeset git-tag`, which tags HEAD `<app>@<version>` for each app whose
#     version has no tag yet. The action pushes each tag it reports and makes
#     its GitHub Release from that app's CHANGELOG.md.
#
# The Version PR is a draft from its opening, and every update makes it one
# again (`pr-draft: always`). CI skips a draft, so a person marking it ready
# for review is what starts its CI, and "ready" means "release exactly this
# content". Merging it, through the merge queue, is the release of every app
# it names.
#
# Each Release then deploys itself (ADR-0125): once the action has published
# the GitHub Releases, the `deploy` job dispatches one Deploy run
# (deploy.yml) with every app released, to staging and then, behind the
# `production` environment's required reviewer, to production. Nothing deploys
# per merge to main, and nothing is dispatched when nothing was released.
#
# A Release is cut only from a revision the merge queue verified (ADR-0036).
# The Version PR goes through the queue like any other, so the commit
# `changeset git-tag` tags is the merge group's head, the exact tree CI passed
# on. The gate refuses to tag a commit no merge-group CI run passed (one
# merged around the queue), before anything is tagged. A group run that
# reused a PR run's verification of the byte-identical tree counts (ADR-0036).
#
# `workflow_dispatch` refreshes the Version PR, or retries a refused or failed
# publish, without a push to main.
#
# The action writes with a token of the release GitHub App (ADR-0124), minted
# in the GitHub environment `release`, which deploys only from main and holds
# the App's KEEPR_RELEASE_APP_ID and KEEPR_RELEASE_APP_PRIVATE_KEY. A Version
# PR opened with GITHUB_TOKEN would start no `pull_request` run (CI, PR title)
# until a maintainer approved it, and GITHUB_TOKEN can never hold `workflows`,
# which the Version PR's branch needs once main's workflows change. The App's
# Version PR starts its runs like anyone's. GITHUB_TOKEN reads the checkout
# and the gate's merge-group runs, which the App cannot read, and writes only
# the `deploy` job's dispatch, with `actions: write` in that job alone.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN's: every write is the App token's, but the `deploy` job's
# dispatch.
permissions:
  contents: read
  # The gate reads the merge-group CI runs on the release commit.
  actions: read

# release-please's group, kept so that a run of it still going when this
# workflow replaced it finished before this one started.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    name: Version PR, or tag and release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Holds the App's key; deploys only from main.
    environment: release
    # What the `deploy` job dispatches: set only once the GitHub Releases exist.
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.changesets.outputs.published-packages }}
    steps:
      # The Version PR's branch and PR, and each tag and GitHub Release.
      # `workflows`: the Version PR's branch is reset to main, whose workflows
      # change. Revoked when the job ends.
      - name: Mint the release GitHub App's token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.KEEPR_RELEASE_APP_ID }}
          private-key: ${{ secrets.KEEPR_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag, so `changeset git-tag` and the gate see which versions
          # are tagged already.
          fetch-depth: 0
          # The action pushes through the GitHub API with the token it is
          # given, not with this checkout's.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          # No cache, so the job that tags a Release never restores one
          # another run could have written.
          package-manager-cache: false
      # No dependency's install script runs in a job that can push to the
      # repository.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The action sets the publish script's GITHUB_TOKEN to the App's token;
      # `gh` prefers GH_TOKEN, so the gate reads the merge-group runs with
      # GITHUB_TOKEN's `actions: read`, which the App does not have.
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version: pnpm release:version
          publish-script: pnpm release:publish
          pr-title: 'chore(release): version apps'
          commit-message: 'chore(release): version apps'
          # Opened as a draft, and made one again by every update: a person
          # marks it ready to release exactly what it holds.
          pr-draft: always

  deploy:
    name: Dispatch the Deploy of the released apps
    needs: release
    # Only after the gate passed, the tags were pushed and the GitHub Releases
    # made, which the plan resolves.
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # GITHUB_TOKEN's workflow_dispatch starts a run, which its other events
    # never do. No environment: it holds no secret.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out the dispatch script from this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .deploy-tooling
          # The script and every module it imports.
          sparse-checkout: |
            packages/tooling/scripts/deploy/
            packages/tooling/scripts/jsonc.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # One run for every app released, to staging and then production
      # (packages/tooling/scripts/deploy/dispatch.mjs).
      - name: Dispatch Deploy to staging, then production
        env:
          GH_TOKEN: ${{ github.token }}
          # The action's output crosses into the shell via env, never by
          # expression interpolation inside `run:`.
          PUBLISHED_PACKAGES: ${{ needs.release.outputs.published-packages }}
        run: node .deploy-tooling/packages/tooling/scripts/deploy/dispatch.mjs
