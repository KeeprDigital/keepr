# The self-contained test set: everything that needs nothing beyond Node,
# Chrome, and workerd. The suites that stay local — and why — are tabled in
# apps/stream/README.md § Testing (ingestion needs a running preview worker, the validator
# needs Docker pre-flight, fonts:library needs a real library store). The six
# `pnpm accept deployed` gates run on deploy day only, started by a person:
# they provision real Events in the Installation they target, staging. The
# still-image and silent-video gates'
# deployed modes, which write nothing, run in the Deploy workflow's staging
# job (ADR-0125).
#
# When it runs, and why no more often (ADR-0036):
#
#   - In the merge queue (`merge_group`): the run that decides what lands. It
#     tests the group's head, the exact combined tree main moves to, so two
#     PRs that each passed against an old main cannot land an untested
#     combination. main then fast-forwards to that commit, and the Release
#     workflow tags only a commit that passed here (packages/tooling/scripts/release-gate.mjs).
#   - On PRs, for feedback and because the queue admits only a PR whose
#     required checks passed. Not on push to main: what main moves to already
#     passed in the queue.
#   - Not on draft PRs. `pnpm verify:quick` is the gate while a branch is in
#     progress; marking the PR ready for review runs CI, the full gate, so
#     nobody runs `pnpm verify` locally just to repeat it.
#   - Only the jobs a change can affect (ADR-0147): a gate only when the change
#     affects a workspace project it checks, the project itself or one it
#     depends on (its `package.json` says which); for docs alone, only the
#     docs checks (`pnpm verify:docs`, in the Workspace checks job); a Worker build
#     only for each deployable app the change ships in. The lockfile, the
#     workspace's configuration, the tooling's scripts, this workflow and its
#     setup run every gate. The `scope` job decides, measuring a PR against
#     its base and a merge group against the queue's base
#     (packages/tooling/scripts/ci-scope.mjs, its `PROJECT_GATES` naming the
#     projects each gate checks); anything it cannot measure or place runs
#     everything.
#   - Not twice on the same tree. A merge group whose tree is byte-identical
#     to one a green PR run verified (one PR, main unchanged since that run)
#     skips every gate, when that run skipped only jobs the group's own scope
#     skips too: the `record` job of that PR run left GitHub's signed word for
#     which commit it ran (packages/tooling/scripts/ci-reuse.mjs). Any doubt
#     runs everything.
#   - A newer push cancels the PR run it supersedes. Every merge-group entry
#     has its own ref, so the queue's runs never cancel each other.
#
# `CI passed` is a required status check, on PRs and merge groups alike, and
# the only one this workflow has: it waits on every other job, so a job's name
# can change without a change to the repository's settings. It always
# reports, whatever was skipped, so a docs-only change is never left waiting
# on a check that cannot arrive; a workflow-level `paths-ignore` would do
# exactly that, and in the queue would hold the group until it timed out.
#
# Stream Keepr is `apps/stream`, Score Keepr `apps/score` and Keepr Accounts
# `apps/accounts` (ADR-0091). Each job that runs an app's scripts runs them in
# its directory (`defaults.run.working-directory`); a `uses:` step, the setup
# action's install among them, runs at the repository's root.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Node's default ~2GB old-space cap is too small on hosted runners for the
# Nuxt/Vite build and vue-tsc alike.
env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  scope:
    name: Decide what the change can affect
    # A merge group carries no `pull_request`; it always runs.
    if: github.event_name == 'merge_group' || !github.event.pull_request.draft
    # Pinned rather than `ubuntu-latest`, so an image change (Chrome, system
    # libraries the browser gates depend on) is a reviewed edit, not a surprise.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # In a merge group: the PR runs' records, their jobs, and the commits
      # they name (packages/tooling/scripts/ci-reuse.mjs).
      actions: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
      docs: ${{ steps.scope.outputs.docs }}
      gates: ${{ steps.scope.outputs.gates }}
      apps: ${{ steps.scope.outputs.apps }}
      verified-by: ${{ steps.scope.outputs.verified-by }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR's test merge commit and its first parent, the base: enough to
          # diff. A merge group's base is further back; the script fetches it,
          # with the credential this checkout leaves. This job uploads nothing.
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packages/tooling/scripts/ci-scope.mjs

  # The gates, grouped by the workspace project each checks, the axis the
  # scope cuts on (ADR-0149): the workspace's own checks, then Stream Keepr's,
  # Score Keepr's, Keepr Accounts' and the packages', each package group named
  # for what consumes it. Each gate but the Workspace checks runs only when
  # the scope lists its job id in `gates`: when the change affects a project
  # it checks (ADR-0147, `PROJECT_GATES` in packages/tooling/scripts/ci-scope.mjs).
  #
  # Every gate `pnpm test` runs (verify.mjs --tests) appears below as its own
  # step (apps/stream/test/unit/scripts/repoWiring.test.ts holds that), split
  # across parallel jobs so the longest one, not the sum, sets the wall time.
  # Stream Keepr's lint, typecheck and two suites were one job of 11 to 18
  # minutes, three times the next longest; each is its own job now, and the
  # Nuxt suite sets the wall time (ADR-0082).

  # The whole workspace, at its root, for any change to the code.
  checks:
    name: Workspace checks
    needs: scope
    # Past the changeset check, the lint steps run for a change that can
    # affect the code, and the docs checks for a change to a document that
    # Stream Keepr's Unit suite, which runs them among its tests, does not check.
    if: needs.scope.outputs.code == 'true' || needs.scope.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the changeset check can measure a merge group
          # from the queue's base as well as a PR from its own.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Every app the change ships in is named in a changeset (ADR-0118). For
      # a docs-only change too: a changeset is Markdown, and one naming an app
      # Changesets does not version would break the next Version PR.
      - name: Changeset check
        run: node packages/tooling/scripts/changeset-check.mjs
      # One run over every app and package (ADR-0089).
      - if: needs.scope.outputs.code == 'true'
        run: pnpm lint
      # The workflows are code nothing else reads before it runs. actionlint
      # checks that each is one GitHub will accept (syntax, expressions, the
      # `run:` scripts through shellcheck); zizmor checks what it is trusted
      # with, such as a checkout that leaves its credential on disk
      # (`.github/zizmor.yml` holds what is switched off, and why). Steps of
      # this job for the reason the docs checks are. Neither is in
      # `pnpm verify`: README § Testing says how to run them.
      - name: actionlint
        if: needs.scope.outputs.code == 'true'
        env:
          # A downloaded binary, so pinned by version and by the SHA-256 its
          # release publishes for linux_amd64 (actionlint_<version>_checksums.txt).
          # Dependabot does not see it: bump the two together by hand.
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          # Without shellcheck, actionlint skips every `run:` script and says nothing.
          shellcheck --version
          "$RUNNER_TEMP/actionlint" -color
      # The action carries its zizmor release, pinned by hash, in its own tree,
      # so this one pin is both and Dependabot moves it. Offline, so the result
      # depends on this tree alone; without `advanced-security`, which would
      # upload the findings rather than fail on them. Not dependabot.yml: a
      # change to it alone is outside the code (packages/tooling/scripts/ci-scope.mjs), so a
      # finding there would fail the next change instead.
      - if: needs.scope.outputs.code == 'true'
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          online-audits: false
          collect: workflows,actions
      # A docs-only change skips the code gates, and a change that skips
      # Stream Keepr's Unit suite skips the documentation test with it, but
      # that test follows every document's links: unchecked, a broken one
      # would fail the next code change instead (#1028). A step of this job,
      # not a job of its own, so that it adds no job a merge group's reuse
      # must account for (packages/tooling/scripts/ci-reuse.mjs).
      - if: needs.scope.outputs.docs == 'true'
        run: pnpm --filter @keepr/stream verify:docs

  # Stream Keepr: each kind of gate a job of its own, in the app's directory.
  stream-typecheck:
    name: 'Stream Keepr: Typecheck'
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.gates), 'stream-typecheck')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/stream
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Includes the silent-video validator Worker's own program (#618), and
      # fails when either committed worker-configuration.d.ts is stale.
      - run: pnpm typecheck

  # With --coverage, so the thresholds in apps/stream/vitest.shared.ts fail these jobs when
  # coverage drops below them (#469).
  stream-unit:
    name: 'Stream Keepr: Unit suite'
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.gates), 'stream-unit')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/stream
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:unit:coverage

  stream-nuxt:
    name: 'Stream Keepr: Nuxt suite'
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.gates), 'stream-nuxt')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/stream
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:nuxt:coverage

  stream-integration:
    name: 'Stream Keepr: Integration suite (${{ matrix.shard }}/2)'
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.gates), 'stream-integration')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/stream
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Each shard starts its own servers over its own databases, so the halves
      # share nothing, the realtime tests included: each server's objects are
      # in the realtime dev Worker beside it, and need no key.
      - run: pnpm test:integration --run --shard=${{ matrix.shard }}/2

  stream-browser:
    name: 'Stream Keepr: Browser gates'
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.gates), 'stream-browser')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/stream
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm accept still-images
      - run: pnpm accept silent-video
      - run: pnpm accept fonts
      - run: pnpm accept animation-effects
      - run: pnpm accept key-matte

  # Score Keepr (ADR-0093): its typecheck, its tests, and the build a Worker
  # would be deployed from. It is scaffolded, not built, and deployed nowhere,
  # so no Worker leg builds it.
  score:
    name: Score Keepr
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.gates), 'score')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/score
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Keepr Accounts (ADR-0112): its typecheck and its server and page tests.
  # Its build, its Worker's dry run and its smoke are its `worker-guard` leg
  # (#1255), which runs whenever the change ships in it: one build a run.
  accounts:
    name: Keepr Accounts
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.gates), 'accounts')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/accounts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm test

  # The packages (ADR-0092), in three groups by what consumes them, each
  # group's typecheck and tests run at the root over exactly its packages,
  # which the filter names. The engines, which only Score Keepr consumes,
  # with the Pairing Engine's speed targets.
  engines:
    name: 'Packages: Engines'
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.gates), 'engines')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter "./packages/{engine-core,pairing,standings,testkit,engine-integration}" typecheck
      - run: pnpm --filter "./packages/{engine-core,pairing,standings,testkit,engine-integration}" --workspace-concurrency=1 test
      - run: pnpm --filter "./packages/{engine-core,pairing,standings,testkit,engine-integration}" --if-present bench:check

  # What the apps share: the Nuxt layer, realtime and the Accounts Stand-in.
  shared-app-code:
    name: 'Packages: Shared app code'
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.gates), 'shared-app-code')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter "./packages/{nuxt-layer,realtime,accounts-stand-in}" typecheck
      - run: pnpm --filter "./packages/{nuxt-layer,realtime,accounts-stand-in}" --workspace-concurrency=1 test

  # The workspace's own tooling (ADR-0110): run slots, deploys, and CI's own
  # scope and reuse.
  tooling:
    name: 'Packages: Tooling'
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.gates), 'tooling')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/tooling
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm test

  # Each deployable app's Worker (an app with a deploy descriptor, ADR-0119),
  # built and checked by the deploy tooling as its deploy builds it: each part
  # bundled as a deploy would upload it (no Docker, no credentials), then the
  # descriptor's build (for Stream Keepr: the build, the wrangler dry run, and
  # the Worker smoke under production-shaped local workerd, the #302 class of
  # failure). The tooling builds an app that binds Keepr Accounts beside the
  # Accounts Stand-in itself, as a deploy's build does (ADR-0113, ADR-0141).
  #
  # One leg per app the change ships in (`apps`, from the scope), so an app it
  # does not touch has no leg rather than a skipped one: a merge group reuses
  # only a run whose skipped jobs its own run would skip too
  # (packages/tooling/scripts/ci-reuse.mjs). An app's tests, docs or another
  # workflow alone run no leg, so the whole job is skipped. That skip a group
  # accepts when its own scope runs no leg either (ADR-0123); it knows the job
  # by this name, which ci-scope.mjs holds as `NO_LEG_WORKER_JOB`.
  worker-guard:
    name: Build, wrangler dry runs, and Worker smoke (${{ matrix.app }})
    needs: scope
    if: needs.scope.outputs.apps != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - env:
          APP: ${{ matrix.app }}
        run: pnpm exec keepr-deploy check --app "$APP"

  # A PR run of code whose gates passed leaves a record of the tree it
  # verified, so its merge group can skip running them again on exactly that
  # tree, when the group's own scope skips every job this run skipped
  # (packages/tooling/scripts/ci-reuse.mjs, ADR-0147). The record is an OIDC token GitHub signs for
  # this job, naming the commit the run executed; the job's own code chooses
  # only the artifact's name, which nothing trusts. A fork's PR gets no token:
  # its group runs everything. Recording never fails `CI passed`; without a
  # record the group runs everything. A run of code that skipped a gate or the
  # Worker job records too (ADR-0123, ADR-0147): the status functions let a
  # skipped job through, and still stop the record when any job failed or was
  # cancelled.
  record:
    name: Record the verified tree
    needs:
      [
        scope,
        checks,
        stream-typecheck,
        stream-unit,
        stream-nuxt,
        stream-integration,
        stream-browser,
        score,
        accounts,
        engines,
        shared-app-code,
        tooling,
        worker-guard,
      ]
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.scope.outputs.code == 'true'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            packages/tooling/scripts/ci-reuse.mjs
            package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - id: record
        run: node packages/tooling/scripts/ci-reuse.mjs record
      - if: steps.record.outputs.name != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.record.outputs.name }}
          path: ${{ steps.record.outputs.path }}
          retention-days: 30
          if-no-files-found: ignore

  passed:
    name: CI passed
    needs:
      [
        scope,
        checks,
        stream-typecheck,
        stream-unit,
        stream-nuxt,
        stream-integration,
        stream-browser,
        score,
        accounts,
        engines,
        shared-app-code,
        tooling,
        worker-guard,
        record,
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # Skipped is fine: `scope` decided the job had nothing to prove, because
      # the change cannot affect it or, in a merge group, because a full green
      # PR run already proved it on exactly this tree (VERIFIED_BY names it).
      # Failed or cancelled is not. A draft PR skips everything and passes
      # here, which is harmless: a draft cannot be queued, and marking it ready
      # runs CI again. `record` proves nothing, so it only warns: it is waited
      # for so its artifact exists before the PR can be queued, and a failed
      # record costs the merge group a full run, never the PR its check.
      # A change to the code that no reuse verified must have run the lint
      # (Workspace checks) and at least one gate: all skipped would pass a
      # change nothing checked (packages/tooling/test/ciWorkflows.test.ts runs
      # this shell).
      - env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.scope.outputs.code }}
          VERIFIED_BY: ${{ needs.scope.outputs.verified-by }}
        run: |
          if [ -n "$VERIFIED_BY" ]; then
            echo "This tree is exactly the one $VERIFIED_BY verified: its gates were not run again."
          elif [ "$CODE" = "true" ]; then
            CHECKS=$(jq -r '.checks.result' <<<"$NEEDS")
            RAN=$(jq -r '[to_entries[] | select(.key != "scope" and .key != "checks" and .key != "record" and .value.result == "success")] | length' <<<"$NEEDS")
            if [ "$CHECKS" != "success" ] || [ "$RAN" -eq 0 ]; then
              echo "::error::The scope found a change to the code, but the lint ended ${CHECKS} and ${RAN} gates ran."
              exit 1
            fi
          fi
          RECORD=$(jq -r '.record.result' <<<"$NEEDS")
          case "$RECORD" in
            success|skipped) ;;
            *) echo "::warning::Recording the verified tree ended $RECORD: its merge group will run everything." ;;
          esac
          RESULTS=$(jq -r 'to_entries | map(select(.key != "record") | .value.result) | join(" ")' <<<"$NEEDS")
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A CI job ended $result."; exit 1 ;;
            esac
          done
