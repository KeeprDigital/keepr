# The workspace: each app, and each package the apps share.
packages:
  - apps/*
  - packages/*

# 24h supply-chain cooldown on new releases. This matches pnpm 11's effective
# default, pinned explicitly so the gate the exclusion list below relies on
# cannot vanish with a package-manager default change (#461).
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - miniflare@5.20261110.2-beta
  - wrangler@4.161.0
trustPolicy: off
shamefullyHoist: true
# Dependencies are hoisted for Nuxt; the workspace's own packages are not. One
# resolves another only by naming it in its `package.json`, so the Pairing and
# Standings Engines cannot come to import each other.
hoistWorkspacePackages: false
shellEmulator: true
verifyDepsBeforeRun: error
engineStrict: true

# Every dependency's version, once, in the named catalog of its group.
# `package.json` names each as `catalog:<group>`, and so does any other package
# of this workspace, so no two disagree. `pnpm add --save-catalog-name=<group>`
# writes its version here (`catalogMode`), exact as every pin is (`saveExact`),
# and an entry nothing names is removed on install.
catalogMode: strict
cleanupUnusedCatalogs: true
saveExact: true
catalogs:
  # Nuxt, Vue and UI
  framework:
    nuxt: 4.6.4
    vue: 3.5.45
    vue-router: 5.5.1
    pinia: 4.1.0
    '@pinia/nuxt': 1.0.3
    '@vueuse/core': 15.0.0
    '@vueuse/nuxt': 15.0.0
    '@nuxt/ui': 4.12.0
    '@nuxt/image': 2.2.1
    '@nuxt/fonts': 1.2.0
    tailwindcss: 4.3.5
    vue-draggable-plus: 0.6.1

  # Charts and 3D
  charts:
    echarts: 6.1.0
    nuxt-echarts: 1.1.0
    vue-echarts: 8.3.2
    three: 0.187.0
    '@types/three': 0.187.0

  # Fonts and icons
  fonts:
    '@fontsource/arimo': 5.3.0
    '@fontsource/barlow-condensed': 5.3.0
    '@fontsource/ibm-plex-sans': 5.3.0
    '@fontsource/inter': 5.3.0
    '@fontsource/jetbrains-mono': 5.3.0
    '@fontsource/montserrat': 5.3.0
    '@fontsource/open-sans': 5.3.0
    '@fontsource/oswald': 5.3.0
    '@fontsource/poppins': 5.3.0
    '@fontsource/roboto': 5.3.0
    '@fontsource/roboto-condensed': 5.3.0
    '@fontsource/saira-condensed': 5.3.0
    '@fontsource/source-serif-4': 5.3.1
    fontkitten: 1.0.3
    mana-font: 1.18.0
    '@iconify-json/lucide': 1.2.155
    '@iconify-json/simple-icons': 1.2.102

  # Image encoding
  images:
    '@jsquash/jpeg': 1.6.0
    '@jsquash/webp': 1.5.0

  # Server: auth, data, validation
  server:
    better-auth: 1.7.25
    drizzle-orm: 0.45.4
    drizzle-zod: 0.8.3
    drizzle-kit: 0.31.11
    zod: 4.6.7
    '@scryfall/api-types': 1.0.0-alpha.4
    jose: 6.2.9

  # Cloudflare
  cloudflare:
    wrangler: 4.161.0
    '@cloudflare/containers': 0.3.7

  # Testing
  test:
    vitest: 5.1.0
    '@vitest/coverage-v8': 5.1.0
    '@vitest/ui': 5.1.0
    '@nuxt/test-utils': 4.4.0
    '@vue/test-utils': 2.6.0
    happy-dom: 21.0.4
    fast-check: 4.10.2
    '@libsql/client': 0.18.0
    yaml: 2.9.1
    # Only the realtime integration files that still listen on Ably (#1317).
    ably: 2.30.0

  # Build, types, lint and format
  tooling:
    typescript: 6.0.3
    vue-tsc: 3.3.13
    '@types/node': 26.6.6
    esbuild: 0.28.2
    oxlint: 1.93.0
    oxlint-tsgolint: 7.0.2007
    oxfmt: 0.78.0
    '@changesets/cli': 3.0.3

# Nuxt UI installs Nuxt Fonts as a module dependency at ^0.14.0. One version
# packages the application fonts, and it is the one the catalog names.
overrides:
  '@nuxt/fonts': 'catalog:framework'

patchedDependencies:
  '@scryfall/api-types@1.0.0-alpha.4': patches/@scryfall__api-types@1.0.0-alpha.4.patch

allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  workerd: true
