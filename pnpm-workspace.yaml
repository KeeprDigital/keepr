# Nuxt UI installs Nuxt Fonts as a module dependency at ^0.14.0. One version
# packages the application fonts, and it is the one the catalog names.
overrides:
  '@nuxt/fonts': 'catalog:'

patchedDependencies:
  '@scryfall/api-types@1.0.0-alpha.4': patches/@scryfall__api-types@1.0.0-alpha.4.patch

allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  workerd: true
