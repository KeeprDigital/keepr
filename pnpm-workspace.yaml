# 24h supply-chain cooldown on new releases. This matches pnpm 11's effective
# default, pinned explicitly so the gate the exclusion list below relies on
# cannot vanish with a package-manager default change (#461).
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.22'
  - '@better-auth/drizzle-adapter@1.7.22'
  - '@better-auth/kysely-adapter@1.7.22'
  - '@better-auth/memory-adapter@1.7.22'
  - '@better-auth/mongo-adapter@1.7.22'
  - '@better-auth/prisma-adapter@1.7.22'
  - '@better-auth/telemetry@1.7.22'
  - '@iconify-json/lucide@1.2.154'
  - better-auth@1.7.22
  - miniflare@5.20261110.2-beta
  - wrangler@4.161.0
trustPolicy: off
shamefullyHoist: true
shellEmulator: true
verifyDepsBeforeRun: error
engineStrict: true

# Every dependency's version, once. `package.json` names each as `catalog:`,
# and so does any other package of this workspace, so no two disagree.
# `pnpm add` writes its version here (`catalogMode`), exact as every pin is
# (`saveExact`), and an entry nothing names is removed on install.
catalogMode: strict
cleanupUnusedCatalogs: true
saveExact: true
catalog:
  '@cloudflare/containers': 0.3.7
  '@fontsource/arimo': 5.3.0
  '@fontsource/barlow-condensed': 5.3.0
  '@fontsource/ibm-plex-sans': 5.3.0
