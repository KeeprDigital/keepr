  '@vitest/ui': 5.1.0
  '@vue/test-utils': 2.5.1
  '@vueuse/core': 15.0.0
  '@vueuse/nuxt': 15.0.0
  ably: 2.30.0
  better-auth: 1.7.22
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  drizzle-zod: 0.8.3
  echarts: 6.1.0
  esbuild: 0.28.2
  fontkitten: 1.0.3
  happy-dom: 21.0.4
  mana-font: 1.18.0
  nuxt: 4.6.4
  nuxt-echarts: 1.1.0
  oxfmt: 0.78.0
  oxlint: 1.93.0
